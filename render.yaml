# Render Blueprint for one-click deploy:
# https://render.com/docs/blueprints
services:
  - type: web
    name: ttyd-cloudflared
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      # Cloudflare Tunnel token (from your tunnel dashboard / `cloudflared tunnel run --token ...`).
      - key: CF_TOKEN
        sync: false
      # Basic-auth credentials for the ttyd web terminal.
      - key: TTYD_USER
        sync: false
      - key: TTYD_PASS
        sync: false
