name: build-wasm

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download c2w v0.8.4
        run: |
          curl -sL -o c2w.tar.gz \
            "https://github.com/container2wasm/container2wasm/releases/download/v0.8.4/container2wasm-v0.8.4-linux-amd64.tar.gz"
          tar xzf c2w.tar.gz
          ./c2w --version

      - name: Build out.wasm (debian:bookworm-slim, guest RAM capped at 256 MB)
        run: |
          # c2w.Dockerfile = c2w's embedded Dockerfile with busybox.net -> buildroot mirror
          # (busybox.net SSL is currently broken). SOURCE_REPO override: c2w v0.8.4 points at
          # ktock/container2wasm which has no v0.8.4 tag; the tag is on the org repo.
          # Retry to absorb transient network blips; buildx cache reuses completed layers.
          for i in 1 2 3; do
            if ./c2w \
              --dockerfile c2w.Dockerfile \
              --build-arg VM_MEMORY_SIZE_MB=256 \
              --build-arg SOURCE_REPO=https://github.com/container2wasm/container2wasm \
              debian:bookworm-slim out.wasm; then
              break
            fi
            echo "c2w build attempt $i failed; retrying in 10s..."; sleep 10
          done
          test -s out.wasm
          ls -lh out.wasm

      - name: Precompile out.wasm -> out.cwasm (eliminates runtime JIT peak)
        run: |
          curl -sL -o /tmp/wt.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v33.0.2/wasmtime-v33.0.2-x86_64-linux.tar.xz"
          tar xf /tmp/wt.tar.xz -C /tmp
          /tmp/wasmtime-v33.0.2-x86_64-linux/wasmtime compile -O opt-level=2 out.wasm -o out.cwasm
          ls -lh out.cwasm

      - name: Publish to rolling release "wasm-build"
        run: |
          gh release delete wasm-build --cleanup-tag -y || true
          gh release create wasm-build out.wasm out.cwasm \
            --target "$GITHUB_SHA" --title "wasm build" \
            --notes "Auto build: debian:bookworm-slim, VM_MEMORY_SIZE_MB=256, precompiled, from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
