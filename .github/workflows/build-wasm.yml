name: build-wasm

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download c2w v0.8.4
        run: |
          curl -sL -o c2w.tar.gz \
            "https://github.com/container2wasm/container2wasm/releases/download/v0.8.4/container2wasm-v0.8.4-linux-amd64.tar.gz"
          tar xzf c2w.tar.gz
          ./c2w --version

      - name: Build out.wasm (debian:bookworm-slim, guest RAM capped at 256 MB)
        run: |
          # SOURCE_REPO override: c2w v0.8.4's embedded Dockerfile points at
          # ktock/container2wasm, which has no v0.8.4 tag. The tag lives on the
          # org repo container2wasm/container2wasm.
          ./c2w \
            --build-arg VM_MEMORY_SIZE_MB=256 \
            --build-arg SOURCE_REPO=https://github.com/container2wasm/container2wasm \
            debian:bookworm-slim out.wasm
          ls -lh out.wasm

      - name: Publish to rolling release "wasm-build"
        run: |
          gh release delete wasm-build --cleanup-tag -y || true
          gh release create wasm-build out.wasm \
            --target "$GITHUB_SHA" --title "wasm build" \
            --notes "Auto build: debian:bookworm-slim, VM_MEMORY_SIZE_MB=256, from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
